[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

[coverage:run]
source = app
omit =
    app/__init__.py
    app/db/__init__.py
    app/api/__init__.py
    app/api/routes/__init__.py
    app/models/__init__.py
    app/services/__init__.py
    app/core/__init__.py

[coverage:report]
fail_under = 95
show_missing = true
